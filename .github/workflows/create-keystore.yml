name: Create keystore (run once)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password for the keystore (write it down!)'
        required: true

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore genki.jks \
            -alias genki \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.password }}" \
            -keypass "${{ github.event.inputs.password }}" \
            -dname "CN=Abu Hafs International School, O=Abu Hafs, L=Bukhara, C=UZ"
          base64 -w 0 genki.jks > genki.jks.base64
          echo "Done. Download the artifact below."

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-KEEP-THIS-SAFE
          path: |
            genki.jks
            genki.jks.base64
          retention-days: 1
